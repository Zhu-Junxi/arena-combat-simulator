<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Duel</title>
<script src="src/scripts/theme/theme-bootstrap.js"></script>
<link rel="preload" as="image" href="assets/weapons/warrior-sword-color.png">
<link rel="preload" as="image" href="assets/weapons/archer-forest-bow.png">
<link rel="preload" as="image" href="assets/weapons/archer-forest-arrow.png">
<link rel="preload" as="image" href="assets/characters/archer/portrait.png">
<link rel="preload" as="image" href="assets/characters/archer/avatar.png">
<link rel="preload" as="image" href="assets/characters/archer/battle.png">
<link rel="preload" as="image" href="assets/weapons/guardian-shield-side.png">
<link rel="preload" as="image" href="assets/weapons/mage-staff.png">
<link rel="preload" as="image" href="assets/weapons/priest-scepter.png">
<link rel="preload" as="image" href="assets/characters/warrior/portrait-color.png">
<link rel="preload" as="image" href="assets/characters/warrior/avatar-color.png">
<link rel="preload" as="image" href="assets/characters/warrior/battle-orb-color.png">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/selection.css">
<link rel="stylesheet" href="src/styles/customization.css">
<link rel="stylesheet" href="src/styles/duel-presets.css">
<link rel="stylesheet" href="src/styles/battle.css">
<link rel="stylesheet" href="src/styles/responsive.css">
<link rel="stylesheet" href="src/styles/battle-layout.css">
<link rel="stylesheet" href="src/styles/polish.css">
</head>
<body data-i18n-ready="false">
<div class="bootstrap-status" id="bootstrap-status" role="status" data-i18n="bootstrap.loading">Loading language data… / 正在加载语言数据…</div>
<div class="bootstrap-error" id="bootstrap-error" role="alert" hidden>
  <p data-i18n="bootstrap.error">Unable to load language data. / 无法加载语言数据。</p>
  <button id="bootstrap-retry" data-i18n="action.retry" data-i18n-tooltip="tooltip.retry">Retry / 重试</button>
</div>
<main class="page">
  <header><h1 data-i18n="app.heading"></h1><div class="header-controls"><span data-i18n="app.tagline"></span><label class="preference-control"><span data-i18n="accessibility.theme"></span><select id="theme-select" data-i18n-tooltip="tooltip.theme"></select></label><label class="preference-control"><span data-i18n="accessibility.language"></span><select id="language-select" data-i18n-tooltip="tooltip.language"></select></label></div></header>
  <section class="stage" id="stage" data-i18n-aria-label="accessibility.stage">
    <div class="arena-view" id="arena" inert aria-hidden="true">
      <div id="duel-corners" aria-hidden="true"></div>
      <div class="duel-heading">
        <button class="duel-back" id="back" data-i18n-tooltip="tooltip.back"><span aria-hidden="true">←</span><span data-i18n="action.back"></span></button>
        <div class="duel-title"><svg viewBox="0 0 350 84" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".8"><path d="M175 4 214 42 175 80 136 42Z M175 10 208 42 175 74 142 42Z"/><path class="duel-title-surface" d="M37 23H313L334 42 313 61H37L16 42Z"/><path d="M43 28H307L323 42 307 56H43L27 42Z"/></g><path fill="currentColor" d="m8 39 3 3-3 3-3-3Zm334 0 3 3-3 3-3-3Z"/></svg><h2 data-i18n="arena.heading"></h2></div>
        <div class="duel-clock"><span data-i18n="hud.time"></span><strong id="duel-clock">00:00</strong></div>
      </div>
      <div class="duel-layout">
        <aside class="duel-side" id="duel-left"></aside>
        <div class="duel-arena-column">
          <div class="duel-caption"><span id="duel-name-left"></span><b>VS</b><span id="duel-name-right"></span></div>
          <div class="duel-arena-frame">
            <i class="duel-field-corner tl"></i><i class="duel-field-corner tr"></i><i class="duel-field-corner bl"></i><i class="duel-field-corner br"></i>
      <div class="battlefield" id="battlefield" data-battle-phase="idle" data-i18n-aria-label="accessibility.battlefield">
        <svg class="duel-field-ornament" viewBox="0 0 600 600" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".7"><path d="M300 272 328 300 300 328 272 300Z M280 300h40M300 280v40M300 0v12M300 588v12M0 300h12M588 300h12"/><circle cx="300" cy="300" r="2"/></g></svg>
        <span class="field-label" data-i18n="arena.field_label"></span>
        <svg id="combat-effects" class="combat-effects" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><g id="zone-effects"></g><g id="weapon-effects"></g><g id="projectile-effects"></g></svg>
        <div class="fighter left" id="fighter-left"></div>
        <span class="field-center" id="countdown" hidden></span>
        <div class="fighter right" id="fighter-right"></div>
      </div>
          </div>
          <div class="duel-arena-bottom"><span aria-hidden="true">──── ◇ ──</span><strong id="duel-result"></strong><span aria-hidden="true">── ◇ ────</span></div>
        </div>
        <aside class="duel-side" id="duel-right"></aside>
      </div>
      <div class="duel-footer"><span class="duel-phase"><i aria-hidden="true"></i><span id="duel-phase"></span></span><div class="duel-event"><time id="duel-event-time"></time><span id="duel-event"></span></div><span class="duel-speed"><span data-i18n="hud.time_scale"></span><b id="duel-speed"></b></span></div>
      <p class="arena-note duel-accessible-note" id="battle-note"></p>
    </div>
    <article class="panel left" id="panel-left" data-i18n-aria-label="accessibility.side_left"></article>
    <article class="panel right" id="panel-right" data-i18n-aria-label="accessibility.side_right"></article>
    <div class="start-control" id="start-control"><button id="start" data-i18n-aria-label="action.start" data-i18n-tooltip="tooltip.start"><svg class="start-art" viewBox="0 0 300 150" aria-hidden="true" focusable="false">
<g class="start-art-surface" stroke-width="1.2"><path d="M150 7 218 75 150 143 82 75Z"/><path d="M150 14 211 75 150 136 89 75Z"/></g>
<g fill="none" stroke="currentColor" stroke-width="1"><path d="m111 33-4 4 4 4m78-8 4 4-4 4m-78 68-4 4 4 4m78-8 4 4-4 4"/><path d="M42 34 7 75l35 41M258 34l35 41-35 41"/></g>
<path class="start-art-surface" d="M44 38H256L291 75 256 112H44L9 75Z" stroke-width="1.5"/>
<path class="start-art-selected" d="M49 42H251L282 75 251 108H49L18 75Z"/>
<path class="start-art-highlight" d="M54 47H246L273 75 246 103H54L27 75Z" fill="none" stroke-width=".8"/>
<path class="start-art-highlight" d="m35 71 4 4-4 4-4-4Zm230 0 4 4-4 4-4-4Z"/>
</svg><span data-i18n="action.start"></span></button></div>
    <section class="dock" id="dock" data-expanded="false" data-i18n-aria-label="accessibility.character_select">
      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel roster-grid-panel" data-i18n-aria-label="customization.expand" data-i18n-tooltip="tooltip.settings">
        <span aria-hidden="true">▲</span>
      </button>
      <button class="roster-grid-toggle" id="roster-grid-toggle" type="button" aria-expanded="false" aria-controls="roster-grid-panel" aria-hidden="true" hidden data-i18n-aria-label="selection.grid_open" data-i18n-tooltip="selection.grid_open"><span aria-hidden="true">▲</span></button>
      <section class="settings-panel" id="settings-panel" aria-hidden="true" inert data-i18n-aria-label="customization.heading">
        <header class="settings-toolbar">
          <div><span data-i18n="customization.eyebrow"></span><h2 data-i18n="customization.heading"></h2></div>
          <div class="settings-actions">
            <label class="advanced-toggle" for="advanced-tuning" data-i18n-tooltip="tooltip.advanced_tuning"><input id="advanced-tuning" type="checkbox"><span data-i18n="customization.advanced_tuning"></span></label>
            <label class="adjustment-step" for="adjustment-step" data-i18n-tooltip="tooltip.adjustment_step"><span data-i18n="customization.adjustment_step"></span><select id="adjustment-step" data-i18n-aria-label="customization.adjustment_step"><option value="0.001">0.001</option><option value="0.01">0.01</option><option value="0.1">0.1</option><option value="1">1</option><option value="5">5</option><option value="10">10</option></select></label>
            <button type="button" id="settings-presets" data-i18n="preset.open" data-i18n-tooltip="preset.open"></button>
            <details class="data-menu"><summary data-i18n="data.manage"></summary><div class="data-menu-actions">
              <button type="button" id="character-export" data-i18n="data.character_export"></button>
              <button type="button" id="character-import" data-i18n="data.character_import"></button>
              <input id="character-import-file" type="file" accept="application/json,.json" hidden>
              <button type="button" id="backup-export" data-i18n="data.backup_export"></button>
              <button type="button" id="backup-import" data-i18n="data.backup_import"></button>
              <input id="backup-import-file" type="file" accept="application/json,.json" hidden>
              <button type="button" id="data-reload" data-i18n="data.reload"></button>
            </div></details>
            <button type="button" id="settings-reset-all" data-i18n-tooltip="tooltip.reset_all"></button>
          </div>
        </header>
        <div class="settings-tabs" id="settings-tabs" role="tablist" data-i18n-aria-label="customization.tabs"></div>
        <div class="settings-content" id="settings-content"></div>
      </section>
      <section class="roster-grid-panel" id="roster-grid-panel" aria-hidden="true" inert aria-labelledby="roster-grid-heading">
        <header class="roster-grid-heading"><div><span data-i18n="selection.grid_eyebrow"></span><h2 id="roster-grid-heading" data-i18n="selection.grid_heading"></h2></div><div class="roster-grid-actions"><div class="roster-grid-sides" id="roster-grid-sides" role="group" data-i18n-aria-label="selection.grid_side_label"></div><button id="roster-grid-start" type="button" data-i18n="action.start" data-i18n-tooltip="tooltip.start"></button></div></header>
        <div class="roster-grid-filters" id="roster-grid-filters" role="group" data-i18n-aria-label="selection.grid_filter_label"></div>
        <div class="roster-grid-cards" id="roster-grid-cards" role="group" data-i18n-aria-label="accessibility.roster"></div>
      </section>
      <div class="dock-main">
        <aside class="category-rail" data-i18n-aria-label="accessibility.category_rail">
          <button class="category-scroll" id="categories-up" data-i18n-aria-label="accessibility.categories_up" data-i18n-title="accessibility.categories_up" data-i18n-tooltip="tooltip.scroll_categories">▲</button>
          <nav class="categories" id="categories" data-i18n-aria-label="accessibility.character_types"></nav>
          <button class="category-scroll" id="categories-down" data-i18n-aria-label="accessibility.categories_down" data-i18n-title="accessibility.categories_down" data-i18n-tooltip="tooltip.scroll_categories">▼</button>
        </aside>
        <div class="roster-area">
          <div class="roster-heading"><strong id="selection-label" data-i18n="selection.initial"></strong><span data-i18n="selection.hint"></span></div>
          <div class="roster" id="roster" data-i18n-aria-label="accessibility.roster"></div>
        </div>
      </div>
    </section>
  </section>
  <footer><span id="status" role="status" aria-live="polite"></span><div class="footer-settings"><button id="global-settings-toggle" type="button" aria-expanded="false" aria-controls="global-settings-popover" data-i18n-aria-label="global_settings.open" data-i18n-tooltip="global_settings.open"><span id="view-label"></span><span class="footer-settings-icon" aria-hidden="true">⚙</span></button><section id="global-settings-popover" class="global-settings-popover" role="dialog" aria-modal="false" aria-labelledby="global-settings-heading" hidden inert><div class="global-settings-head"><h2 id="global-settings-heading" data-i18n="global_settings.heading"></h2><button id="global-settings-close" type="button" data-i18n-aria-label="global_settings.close" data-i18n-tooltip="global_settings.close">×</button></div><p data-i18n="global_settings.placeholder"></p></section></div></footer>
</main>
<div id="feedback-toast" class="feedback-toast" aria-hidden="true" hidden></div>
<dialog id="preset-dialog" class="preset-dialog" aria-labelledby="preset-heading">
  <div class="preset-shell">
    <header class="preset-header">
      <div><span class="preset-eyebrow" data-i18n="preset.eyebrow"></span><h2 id="preset-heading" data-i18n="preset.heading"></h2></div>
      <button type="button" id="preset-close" class="preset-close" data-i18n="preset.close" data-i18n-aria-label="preset.close"></button>
    </header>
    <div class="preset-toolbar">
      <label class="preset-search"><span data-i18n="preset.search_label"></span><input id="preset-search" type="search" data-i18n-aria-label="preset.search_label"></label>
      <div id="preset-filters" class="preset-filters" role="group" data-i18n-aria-label="preset.filter_label"></div>
      <div class="preset-toolbar-actions"><button type="button" id="preset-save-current" data-i18n="preset.save_current"></button><button type="button" id="preset-import" data-i18n="preset.import"></button></div>
      <input id="preset-import-file" type="file" accept="application/json,.json" hidden>
    </div>
    <div id="preset-grid" class="preset-grid"></div>
    <section id="preset-editor" class="preset-inline-panel" hidden>
      <label for="preset-name" id="preset-editor-label"></label>
      <div><input id="preset-name" type="text" maxlength="80"><button type="button" id="preset-editor-submit" data-i18n="preset.save"></button><button type="button" id="preset-editor-cancel" data-i18n="preset.cancel"></button></div>
    </section>
    <section id="preset-confirm" class="preset-inline-panel" hidden>
      <p id="preset-confirm-message"></p>
      <div><button type="button" id="preset-confirm-primary"></button><button type="button" id="preset-confirm-secondary"></button></div>
    </section>
    <p id="preset-status" class="preset-status" role="status" aria-live="polite"></p>
  </div>
  <div id="preset-feedback-toast" class="feedback-toast" aria-hidden="true" hidden></div>
</dialog>
<script type="module" src="src/scripts/app.js"></script>
</body>
</html>
